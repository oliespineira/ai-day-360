<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Day 360° Gallery – The Global College</title>
<meta name="description" content="360° films made by students of The Global College for AI Day.">
<meta name="theme-color" content="#030305">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
  <!-- Background layers: shader, blueprint grid, film grain -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="layer-grid" aria-hidden="true"></div>
  <div class="layer-grain" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top">AI Day</a>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <p class="hero-meta" data-i18n="heroMeta"></p>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-sub" data-i18n="heroSub"></p>
      <button class="btn btn-primary" id="startBtn" type="button" disabled>
        <span data-i18n="start"></span>
      </button>
    </section>

    <section class="gallery" aria-labelledby="galleryTitle">
      <div class="section-head">
        <h2 id="galleryTitle" data-i18n="galleryTitle"></h2>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
      <p class="quest-hint" id="questHint" data-i18n="questOpenHint" hidden></p>
      <ul class="cards" id="cards"></ul>
    </section>

    <section class="howto" aria-labelledby="howtoTitle">
      <h2 id="howtoTitle" data-i18n="howtoTitle"></h2>
      <div class="howto-grid">
        <article class="howto-card">
          <h3 data-i18n="questTitle"></h3>
          <ol>
            <li data-i18n="quest1"></li>
            <li data-i18n="quest2"></li>
            <li data-i18n="quest3"></li>
          </ol>
        </article>
        <article class="howto-card">
          <h3 data-i18n="phoneTitle"></h3>
          <ol>
            <li data-i18n="phone1"></li>
            <li data-i18n="phone2"></li>
          </ol>
        </article>
        <article class="howto-card">
          <h3 data-i18n="pcTitle"></h3>
          <ol>
            <li data-i18n="pc1"></li>
            <li data-i18n="pc2"></li>
          </ol>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer"></p>
  </footer>

  <!-- Full-screen viewer -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
    <div class="viewer-bar">
      <button class="btn btn-ghost" id="backBtn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="back"></span>
      </button>
      <div class="viewer-heading">
        <p class="viewer-group" id="viewerGroup"></p>
        <h2 class="viewer-title" id="viewerTitle"></h2>
      </div>
      <p class="viewer-count" id="viewerCount"></p>
    </div>

    <div class="viewer-stage" id="stage">
      <div class="player-frame"><div id="player"></div></div>
    </div>

    <div class="viewer-controls">
      <button class="btn btn-round" id="prevBtn" type="button" data-i18n-label="prev">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn btn-ghost" id="fsBtn" type="button"><span data-i18n="fullscreen"></span></button>
      <a class="btn btn-ghost" id="ytLink" href="#" target="_blank" rel="noopener"><span data-i18n="openYt"></span></a>
      <button class="btn btn-round" id="nextBtn" type="button" data-i18n-label="next">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <p class="viewer-help" id="viewerHelp" data-i18n="help"></p>
    <ul class="strip" id="strip"></ul>
  </div>

  <!-- Off-screen helper used to read the playlist -->
  <div id="probe" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
